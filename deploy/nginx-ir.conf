-- # 生产部署模板：Nginx 反向代理 + TLS
-- #
-- # 用法：
-- #   1. 将此文件放到 /etc/nginx/sites-available/ir
-- #   2. ln -s /etc/nginx/sites-available/ir /etc/nginx/sites-enabled/
-- #   3. 替换 server_name 和 ssl_certificate 路径
-- #   4. nginx -t && systemctl reload nginx
--
-- # 环境变量（Core 侧）：
-- #   PLATFORM__PUBLIC_BASE_URL=https://ir.example.com
-- #   ADMIN__SECURE_COOKIES=true

-- 实际 nginx 配置如下（去掉前面的 Lua 注释前缀即可用）：

--[[
upstream ir_core {
    # 多副本 Core：轮询负载均衡
    server 127.0.0.1:8080;
    # server 127.0.0.1:8081;  # 第二副本
    # server 10.0.0.2:8080;   # 跨机副本
    keepalive 32;
}

# 限流（第一层：Nginx 层，第二层在应用层）
limit_req_zone $binary_remote_addr zone=ir_api:10m rate=10r/s;
limit_req_zone $http_authorization zone=ir_user:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name ir.example.com;

    # TLS（Let's Encrypt 或自有证书）
    ssl_certificate /etc/letsencrypt/live/ir.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ir.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体限制
    client_max_body_size 4m;

    # 静态资产（管理台 SPA）：Nginx 直接服务 + 缓存
    location /admin/ {
        proxy_pass http://ir_core;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 动态入口（签名验证）：限流
    location /agent/ {
        limit_req zone=ir_api burst=20 nodelay;
        proxy_pass http://ir_core;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3700s;  # 长分析任务
    }

    # agent-api（Edge 连接器）：更高限流（长轮询）
    location /agent-api/ {
        proxy_pass http://ir_core;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 45s;   # claim 长轮询 35s + 余量
    }

    # 管理 API：限流
    location /api/admin/ {
        limit_req zone=ir_api burst=10 nodelay;
        proxy_pass http://ir_core;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公开分享端点：限流更严
    location /api/share/ {
        limit_req zone=ir_api burst=5 nodelay;
        proxy_pass http://ir_core;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus 指标：仅内网访问
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://ir_core;
    }

    # 默认：代理到 Core
    location / {
        proxy_pass http://ir_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name ir.example.com;
    return 301 https://$server_name$request_uri;
}
]]
